<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Teacher - IRIS</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f1f5f9;color:#0f172a}
header{background:#1e3a8a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header b{font-size:18px} header span{font-size:12px;background:#facc15;color:#000;padding:3px 8px;border-radius:20px}
.wrap{max-width:520px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.btn{border:0;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.primary{background:#1e3a8a;color:#fff} .yellow{background:#facc15}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;margin:6px 0}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.nav button{background:#fff;border:1px solid #e2e8f0;padding:10px 4px;border-radius:12px;font-weight:700}
.nav button.active{background:#1e3a8a;color:#fff}
.hidden{display:none} .row{display:flex;gap:8px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e2e8f0}
.iris-img{width:150px;height:150px;border-radius:50%;border:4px solid #facc15;object-fit:cover;background:#fef9c3}
.stu{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #f1f5f9}
</style>
</head>
<body>
<header><div><b>REAL TEACHER</b><br><small>Mwalimu wa Kweli</small></div><span>IRIS AI</span></header>

<div class="wrap">
<!-- LOGIN -->
<div id="auth" class="card">
<h2 style="text-align:center">Karibu Mwalimu 👩🏻‍🏫</h2>
<input id="tName" placeholder="Jina lako">
<input id="tSchool" placeholder="Shule">
<input id="tPass" type="password" placeholder="Password">
<button class="btn primary" style="width:100%" onclick="login()">Ingia / Jisajili</button>
<p style="text-align:center;font-size:12px;color:#64748b">App inahifadhi data kwenye simu yako</p>
</div>

<!-- MAIN -->
<div id="main" class="hidden">
<div class="card row">
<img id="myPic" class="avatar" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">
<div style="flex:1"><b id="showName">Mwalimu</b><br><small id="showSchool"></small></div>
<button onclick="changePic()">Badilisha Picha</button>
</div>

<div class="nav">
<button onclick="show('dash',this)" class="active">Nyumbani</button>
<button onclick="show('students',this)">Wanafunzi</button>
<button onclick="show('ai',this)">IRIS AI</button>
<button onclick="show('settings',this)">Mipangilio</button>
</div>

<!-- DASH -->
<div id="dash" class="card">
<h3>Leo: <span id="today"></span></h3>
<p>Wanafunzi: <b id="totalStu">0</b></p>
<div class="row"><input id="newStu" placeholder="Jina la mwanafunzi"><button class="btn primary" onclick="addStu()">Ongeza</button></div>
<div id="list"></div>
</div>

<!-- STUDENTS -->
<div id="students" class="card hidden">
<h3>Orodha ya Wanafunzi</h3>
<div id="list2"></div>
</div>

<!-- IRIS - MPYA -->
<div id="ai" class="card hidden">
<div style="text-align:center">
<img src="iris.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4140/4140048.png'" class="iris-img">
<h2 style="margin:8px 0 0">👩🏻‍🏫 AI IRIS</h2>
<p style="margin:0;color:#64748b;font-size:13px">Msaidizi wako wa Kike - Niulize chochote!</p>
</div>

<input id="aiQ" placeholder="Uliza IRIS... mf: Andika barua ya ruhusa">
